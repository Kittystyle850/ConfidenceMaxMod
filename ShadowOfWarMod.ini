; Shadow of War mod - put this file next to ShadowOfWarMod.dll (read once at load)

[Features]
; Uruk spawn rarity: new Uruks are generated with this rarity (legendary | epic)
UrukSpawnRarity=1
Rarity=legendary
; Reveal all intel (name, strengths, weaknesses) on every Uruk
GetAllUrukIntel=1
; Pick more than one skill in the skill screen
ChooseMultipleSkills=1
; Mission timers never run out
InfiniteMissionTime=1

[Drops]
; Epic/Legendary Uruks ALWAYS drop this entry of "Faction/Loot/NemesisGear".
; Leave empty to disable. The full list of valid ids is written to
; ShadowOfWarMod_drops.txt (next to the DLL) once the game database is loaded.
ItemId=
DumpDropList=1
