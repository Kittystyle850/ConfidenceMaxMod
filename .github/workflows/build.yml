name: Build OnimushaMod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/OnimushaMod.dll dist/
          Copy-Item OnimushaMod.ini dist/
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: OnimushaMod
          path: dist/
