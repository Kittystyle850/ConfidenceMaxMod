; OnimushaMod - put next to OnimushaMod.dll in the game folder.
; All keys are hot-reloadable? No. Restart the game after edits.

[AnimationCancel]
; Master switch. F1 in game toggles this at runtime.
Enabled=1
; Per-category. Only enabled categories are forced.
Attacks=1
Dodge=1
Guard=1
Move=0
Issen=0
Other=0

[InstantParry]
; Lockout frames after a just input. -1 = game default, 0 = instant, N = N frames.
GuardLockout=0
IssenLockout=-1
GrabLockout=-1
DodgeLockout=-1
; Timing window multiplier (1.0 = game, 2.0 = twice as long).
GuardWindow=1.0
IssenWindow=1.0
GrabWindow=1.0
DodgeWindow=1.0

[Features]
; Fine-grained toggles for debugging. Disable one at a time if something misbehaves.
PhaseWrites=1
MaskClearing=1
LockoutOverride=1
WindowMultiplier=1
ReflexHold=1
; WrapperOverrides uses the CT's 3-arg signature for checkCancelMotion.
; Enable only if the core works but some commands are still blocked.
WrapperOverrides=0

[Debug]
Log=1
HotkeyF1=1