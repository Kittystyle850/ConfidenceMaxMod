; OnimushaMod - put next to OnimushaMod.dll in the game folder.
; Sections [AnimationCancel], [InstantParry], [Features], [Debug]:
;   reloaded at runtime by pressing F2 in game.
; Section [Hooks]:
;   read only at injection (MinHook cannot reinstall hooks at runtime).

[AnimationCancel]
Enabled=1
Attacks=1
Dodge=1
Guard=1
Move=0
Issen=0
Other=0

[InstantParry]
GuardLockout=0
IssenLockout=-1
GrabLockout=-1
DodgeLockout=-1
GuardWindow=1.0
IssenWindow=1.0
GrabWindow=1.0
DodgeWindow=1.0

[Features]
PhaseWrites=1
MaskClearing=1
LockoutOverride=1
WindowMultiplier=1
ReflexHold=1
WrapperOverrides=0

[Hooks]
; Only read at injection time. Restart the game to change these.
LateUpdate=1
CtrlUpdate=1
SelUpdate=1
GetJustFrame=1

[Debug]
Log=1
HotkeyF1=1
HotkeyF2=1
; SAFE_MODE=1 disables ALL game function calls (getActionState, isJustDodgeAttackAccepting).
; Set to 0 only after the crash is confirmed gone with SafeMode=1.
SafeMode=1
