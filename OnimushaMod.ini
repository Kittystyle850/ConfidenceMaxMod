; OnimushaMod - put next to OnimushaMod.dll in the game folder.

[AnimationCancel]
Enabled=1
Attacks=1
Dodge=1
Guard=1
Move=0
Issen=0
Other=0

[InstantParry]
GuardLockout=0
IssenLockout=-1
GrabLockout=-1
DodgeLockout=-1
GuardWindow=1.0
IssenWindow=1.0
GrabWindow=1.0
DodgeWindow=1.0

[Features]
; Disable one at a time if something misbehaves.
PhaseWrites=1
MaskClearing=1
LockoutOverride=1
WindowMultiplier=1
ReflexHold=1
WrapperOverrides=0

[Hooks]
; Disable a hook entirely if the game crashes.
LateUpdate=1
CtrlUpdate=1
SelUpdate=1
GetJustFrame=1

[Debug]
Log=1
HotkeyF1=1
; SafeMode=1 disables all game function calls from the hooks (pure passthrough).
; Use to distinguish "hook install" vs "hook implementation" crashes.
SafeMode=0